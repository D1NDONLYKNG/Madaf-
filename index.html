<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Sharing</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    .arabic {
      direction: rtl;
      font-size: 18px;
      color: #222;
    }

    button {
      margin-top: 15px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    #shareButton {
      display: none;
    }

    #result {
      margin-top: 25px;
      line-height: 1.7;
      word-break: break-word;
    }

    .map {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #eee;
      color: #111;
      text-decoration: none;
      border-radius: 9px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📍 Location Sharing</h1>

  <p class="arabic">
    سيتم إرسال موقعك إلى مالك الجهاز بعد موافقتك.
  </p>

  <p>
    Your location can be shared with the device owner
    after you give permission.
  </p>

  <button onclick="getLocation()">
    Allow Location Access
  </button>

  <button id="shareButton" onclick="shareLocation()">
    مشاركة موقعي
  </button>

  <div id="result"></div>

</div>

<script>

let mapsURL = "";

function getLocation() {

  const result =
    document.getElementById("result");

  const shareButton =
    document.getElementById("shareButton");

  if (!navigator.geolocation) {

    result.textContent =
      "Your browser does not support location services.";

    return;
  }

  result.textContent =
    "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;

      mapsURL =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      result.innerHTML = `
        <strong>✅ Location access accepted.</strong>

        <br><br>

        Latitude:
        ${latitude.toFixed(6)}

        <br>

        Longitude:
        ${longitude.toFixed(6)}

        <br>

        Approximate accuracy:
        ${Math.round(accuracy)} meters

        <br>

        <a
          class="map"
          href="${mapsURL}"
          target="_blank"
          rel="noopener noreferrer"
        >
          📍 Open in Google Maps
        </a>
      `;

      shareButton.style.display = "block";
    },

    function(error) {

      if (error.code === 1) {

        result.textContent =
          "❌ Location access was denied.";

      } else if (error.code === 2) {

        result.textContent =
          "❌ Location is unavailable.";

      } else if (error.code === 3) {

        result.textContent =
          "❌ Location request timed out.";

      } else {

        result.textContent =
          "❌ Could not obtain location.";

      }
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );
}


async function shareLocation() {

  if (!mapsURL) {
    return;
  }

  const shareData = {
    title: "My Location",
    text: "Here is my current location:",
    url: mapsURL
  };

  if (navigator.share) {

    try {

      await navigator.share(shareData);

    } catch (error) {

      console.log("Sharing cancelled.");

    }

  } else {

    try {

      await navigator.clipboard.writeText(mapsURL);

      alert(
        "Location link copied. Paste it into Messages to share it."
      );

    } catch (error) {

      alert(mapsURL);

    }
  }
}

</script>

</body>
</html>
