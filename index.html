<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Sharing</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  background: white;
  width: 100%;
  max-width: 460px;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,.12);
  text-align: center;
}

h1 { margin-bottom: 20px; }

.notice {
  background: #f1f1f1;
  padding: 16px;
  border-radius: 12px;
  line-height: 1.5;
  margin-bottom: 20px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 16px;
}

#sendButton { display: none; }

#result, #status {
  margin-top: 20px;
  line-height: 1.7;
}

#status { font-weight: bold; }

.map {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 18px;
  background: #eee;
  color: #111;
  text-decoration: none;
  border-radius: 9px;
}
</style>
</head>

<body>

<div class="container">

  <h1>📍 Location Sharing</h1>

  <div class="notice">
    This website can access your current location after you approve
    the browser's location request.
    <br><br>

    <strong>
      Allowing location access does NOT automatically send your location.
    </strong>

    <br><br>

    After viewing the location, you can choose whether to send it to:
    <br><br>

    <strong>europeanparlamentaryofficial@gmail.com</strong>
  </div>

  <button onclick="getLocation()">
    Allow Location Access
  </button>

  <div id="result"></div>

  <button id="sendButton" onclick="sendLocation()">
    Yes — Send My Current Location to europeanparlamentaryofficial@gmail.com
  </button>

  <div id="status"></div>

</div>

<script>

let latitude = null;
let longitude = null;
let accuracy = null;
let mapsURL = "";

function getLocation() {

  const result = document.getElementById("result");
  const sendButton = document.getElementById("sendButton");

  if (!navigator.geolocation) {
    result.textContent = "Location services aren't supported.";
    return;
  }

  result.textContent = "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;
      accuracy = position.coords.accuracy;

      mapsURL =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      result.innerHTML = `
        <strong>✅ Location access accepted.</strong>
        <br><br>

        Latitude: ${latitude.toFixed(6)}
        <br>
        Longitude: ${longitude.toFixed(6)}
        <br>
        Approximate accuracy: ${Math.round(accuracy)} meters

        <br>

        <a class="map"
           href="${mapsURL}"
           target="_blank"
           rel="noopener noreferrer">
           📍 View Current Location
        </a>

        <br><br>

        <strong>
          Do you want to send this location to
          europeanparlamentaryofficial@gmail.com?
        </strong>
      `;

      sendButton.style.display = "block";
    },

    function(error) {

      if (error.code === 1)
        result.textContent = "❌ Location access was denied.";
      else if (error.code === 2)
        result.textContent = "❌ Location is unavailable.";
      else if (error.code === 3)
        result.textContent = "❌ Location request timed out.";
      else
        result.textContent = "❌ Could not obtain location.";
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}

async function sendLocation() {

  const button = document.getElementById("sendButton");
  const status = document.getElementById("status");

  if (latitude === null || longitude === null)
    return;

  button.disabled = true;
  button.textContent = "Sending location...";

  const data = new FormData();

  data.append(
    "Consent",
    "User explicitly chose to send their current location to europeanparlamentaryofficial@gmail.com"
  );

  data.append("Latitude", latitude);
  data.append("Longitude", longitude);
  data.append("Accuracy", Math.round(accuracy) + " meters");
  data.append("Google Maps", mapsURL);
  data.append("Timestamp", new Date().toISOString());

  try {

    const response = await fetch(
      "https://formspree.io/f/mwlennvb",
      {
        method: "POST",
        body: data,
        headers: {
          "Accept": "application/json"
        }
      }
    );

    if (response.ok) {

      status.textContent =
        "✅ Location successfully sent to europeanparlamentaryofficial@gmail.com.";

      button.style.display = "none";

    } else {

      status.textContent =
        "❌ Location couldn't be sent. Please try again.";

      button.disabled = false;
      button.textContent =
        "Yes — Send My Current Location to europeanparlamentaryofficial@gmail.com";
    }

  } catch (error) {

    status.textContent =
      "❌ Network error. Please try again.";

    button.disabled = false;
    button.textContent =
      "Yes — Send My Current Location to europeanparlamentaryofficial@gmail.com";
  }
}

</script>

</body>
</html>
